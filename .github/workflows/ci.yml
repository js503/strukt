name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build native application
        run: cargo build -p strukt-app
      - name: Build terminal fixture
        run: cargo build -p strukt-terminal --bin terminal-fixture
      - name: Build language fixture
        run: cargo build -p strukt-language --bin language-fixture
      - name: Smoke local workspace files
        if: runner.os != 'Windows'
        shell: bash
        run: |
          fixture="$(mktemp -d)"
          printf 'strukt\n' > "$fixture/strukt-smoke.txt"
          cargo run -p strukt-app -- --workspace-files-smoke "$fixture" |
            tee workspace-files-smoke.log
          grep -F "strukt workspace files smoke: open, discovery, and persistence passed" \
            workspace-files-smoke.log
      - name: Smoke local workspace files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "strukt-workspace-files-smoke"
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          Set-Content -Path (Join-Path $fixture "strukt-smoke.txt") -Value "strukt"
          $output = & cargo run -p strukt-app -- --workspace-files-smoke $fixture 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) {
            throw "workspace files smoke exited with code $LASTEXITCODE"
          }
          if (($output -join "`n") -notmatch
              "strukt workspace files smoke: open, discovery, and persistence passed") {
            throw "workspace files smoke marker missing"
          }
      - name: Smoke editor workflow
        if: runner.os != 'Windows'
        shell: bash
        run: |
          fixture="$(mktemp -d)"
          printf 'strukt\n' > "$fixture/strukt-editor-smoke.txt"
          cargo run -p strukt-app -- --editor-smoke "$fixture" |
            tee editor-smoke.log
          grep -Fx "strukt editor smoke: open, edit, save, and restore passed" \
            editor-smoke.log
          test ! -e "$fixture/.strukt"
      - name: Smoke editor workflow
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ("strukt-editor-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          $sentinel = Join-Path $fixture "strukt-editor-smoke.txt"
          [System.IO.File]::WriteAllBytes(
            $sentinel,
            [System.Text.UTF8Encoding]::new($false).GetBytes("strukt`n")
          )
          $output = & cargo run -p strukt-app -- --editor-smoke $fixture 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) {
            throw "editor smoke exited with code $LASTEXITCODE"
          }
          if (($output -join "`n") -notmatch
              "strukt editor smoke: open, edit, save, and restore passed") {
            throw "editor smoke marker missing"
          }
          if (Test-Path (Join-Path $fixture ".strukt")) {
            throw "editor smoke created workspace metadata"
          }
      - name: Smoke local terminal workflow
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 2
        run: |
          fixture="$(mktemp -d)"
          cargo run -p strukt-app -- --terminal-smoke "$fixture" |
            tee terminal-smoke.log
          grep -Fx \
            "strukt terminal smoke: pty, unicode, ansi, resize, isolation, bounds, and restore passed" \
            terminal-smoke.log
          test ! -e "$fixture/.strukt"
      - name: Smoke local terminal workflow
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ("strukt-terminal-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          $output = & cargo run -p strukt-app -- --terminal-smoke $fixture 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) {
            throw "terminal smoke exited with code $LASTEXITCODE"
          }
          if (($output -join "`n") -notmatch
              "strukt terminal smoke: pty, unicode, ansi, resize, isolation, bounds, and restore passed") {
            throw "terminal smoke marker missing"
          }
          if (Test-Path (Join-Path $fixture ".strukt")) {
            throw "terminal smoke created workspace metadata"
          }
      - name: Smoke language and M2 integration
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 3
        run: |
          fixture="$(mktemp -d)"
          printf 'strukt\n' > "$fixture/strukt-smoke.txt"
          printf 'strukt\n' > "$fixture/strukt-editor-smoke.txt"
          cargo run -p strukt-app -- --language-smoke "$fixture" | tee language-smoke.log
          grep -Fx "strukt language smoke: discovery, sync, diagnostics, completion, hover, definition, cancellation, shutdown, and restore passed" language-smoke.log
          cargo run -p strukt-app -- --m2-integration-smoke "$fixture" | tee m2-smoke.log
          grep -Fx "strukt M2 integration smoke: files, editor, terminal, language, persistence, isolation, and stopped restore passed" m2-smoke.log
          test ! -e "$fixture/.strukt"
      - name: Smoke language and M2 integration
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ("strukt-m2-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          Set-Content -Path (Join-Path $fixture "strukt-smoke.txt") -Value "strukt"
          Set-Content -Path (Join-Path $fixture "strukt-editor-smoke.txt") -Value "strukt"
          $language = & cargo run -p strukt-app -- --language-smoke $fixture 2>&1
          $language | Write-Output
          if ($LASTEXITCODE -ne 0 -or ($language -join "`n") -notmatch "strukt language smoke: discovery, sync, diagnostics, completion, hover, definition, cancellation, shutdown, and restore passed") {
            throw "language smoke failed"
          }
          $m2 = & cargo run -p strukt-app -- --m2-integration-smoke $fixture 2>&1
          $m2 | Write-Output
          if ($LASTEXITCODE -ne 0 -or ($m2 -join "`n") -notmatch "strukt M2 integration smoke: files, editor, terminal, language, persistence, isolation, and stopped restore passed") {
            throw "M2 integration smoke failed"
          }
          if (Test-Path (Join-Path $fixture ".strukt")) {
            throw "M2 smoke created workspace metadata"
          }
      - name: Smoke launch native Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $output = & cargo run -p strukt-app -- --smoke-test 2>&1
          $output | Write-Output

          if ($LASTEXITCODE -ne 0) {
            throw "strukt smoke test exited with code $LASTEXITCODE"
          }

          if (($output -join "`n") -notmatch "strukt smoke test: native event loop started") {
            throw "strukt smoke test did not emit its success marker"
          }
