name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build native application
        run: cargo build -p strukt-app
      - name: Build terminal fixture
        run: cargo build -p strukt-terminal --bin terminal-fixture
      - name: Build language fixture
        run: cargo build -p strukt-language --bin language-fixture
      - name: Build persistent session helpers
        run: cargo build -p strukt-session --bin strukt-sessiond --bin session-fixture
      - name: Build SSH remote workspace helpers
        run: cargo build -p strukt-remote --bins
      - name: Smoke local workspace files
        if: runner.os != 'Windows'
        shell: bash
        run: |
          fixture="$(mktemp -d)"
          printf 'strukt\n' > "$fixture/strukt-smoke.txt"
          cargo run -p strukt-app -- --workspace-files-smoke "$fixture" |
            tee workspace-files-smoke.log
          grep -F "strukt workspace files smoke: open, discovery, and persistence passed" \
            workspace-files-smoke.log
      - name: Smoke local workspace files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "strukt-workspace-files-smoke"
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          Set-Content -Path (Join-Path $fixture "strukt-smoke.txt") -Value "strukt"
          $output = & cargo run -p strukt-app -- --workspace-files-smoke $fixture 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) {
            throw "workspace files smoke exited with code $LASTEXITCODE"
          }
          if (($output -join "`n") -notmatch
              "strukt workspace files smoke: open, discovery, and persistence passed") {
            throw "workspace files smoke marker missing"
          }
      - name: Smoke editor workflow
        if: runner.os != 'Windows'
        shell: bash
        run: |
          fixture="$(mktemp -d)"
          printf 'strukt\n' > "$fixture/strukt-editor-smoke.txt"
          cargo run -p strukt-app -- --editor-smoke "$fixture" |
            tee editor-smoke.log
          grep -Fx "strukt editor smoke: open, edit, save, and restore passed" \
            editor-smoke.log
          test ! -e "$fixture/.strukt"
      - name: Smoke editor workflow
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ("strukt-editor-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          $sentinel = Join-Path $fixture "strukt-editor-smoke.txt"
          [System.IO.File]::WriteAllBytes(
            $sentinel,
            [System.Text.UTF8Encoding]::new($false).GetBytes("strukt`n")
          )
          $output = & cargo run -p strukt-app -- --editor-smoke $fixture 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) {
            throw "editor smoke exited with code $LASTEXITCODE"
          }
          if (($output -join "`n") -notmatch
              "strukt editor smoke: open, edit, save, and restore passed") {
            throw "editor smoke marker missing"
          }
          if (Test-Path (Join-Path $fixture ".strukt")) {
            throw "editor smoke created workspace metadata"
          }
      - name: Smoke local terminal workflow
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 2
        run: |
          fixture="$(mktemp -d)"
          cargo run -p strukt-app -- --terminal-smoke "$fixture" |
            tee terminal-smoke.log
          grep -Fx \
            "strukt terminal smoke: pty, unicode, ansi, resize, isolation, bounds, and restore passed" \
            terminal-smoke.log
          test ! -e "$fixture/.strukt"
      - name: Smoke local terminal workflow
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ("strukt-terminal-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          $output = & cargo run -p strukt-app -- --terminal-smoke $fixture 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) {
            throw "terminal smoke exited with code $LASTEXITCODE"
          }
          if (($output -join "`n") -notmatch
              "strukt terminal smoke: pty, unicode, ansi, resize, isolation, bounds, and restore passed") {
            throw "terminal smoke marker missing"
          }
          if (Test-Path (Join-Path $fixture ".strukt")) {
            throw "terminal smoke created workspace metadata"
          }
      - name: Smoke language and M2 integration
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 3
        run: |
          fixture="$(mktemp -d)"
          printf 'strukt\n' > "$fixture/strukt-smoke.txt"
          printf 'strukt\n' > "$fixture/strukt-editor-smoke.txt"
          cargo run -p strukt-app -- --language-smoke "$fixture" | tee language-smoke.log
          grep -Fx "strukt language smoke: discovery, sync, diagnostics, completion, hover, definition, cancellation, shutdown, and restore passed" language-smoke.log
          cargo run -p strukt-app -- --m2-integration-smoke "$fixture" | tee m2-smoke.log
          grep -Fx "strukt M2 integration smoke: files, editor, terminal, language, persistence, isolation, and stopped restore passed" m2-smoke.log
          test ! -e "$fixture/.strukt"
      - name: Smoke language and M2 integration
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ("strukt-m2-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          Set-Content -Path (Join-Path $fixture "strukt-smoke.txt") -Value "strukt"
          Set-Content -Path (Join-Path $fixture "strukt-editor-smoke.txt") -Value "strukt"
          $language = & cargo run -p strukt-app -- --language-smoke $fixture 2>&1
          $language | Write-Output
          if ($LASTEXITCODE -ne 0 -or ($language -join "`n") -notmatch "strukt language smoke: discovery, sync, diagnostics, completion, hover, definition, cancellation, shutdown, and restore passed") {
            throw "language smoke failed"
          }
          $m2 = & cargo run -p strukt-app -- --m2-integration-smoke $fixture 2>&1
          $m2 | Write-Output
          if ($LASTEXITCODE -ne 0 -or ($m2 -join "`n") -notmatch "strukt M2 integration smoke: files, editor, terminal, language, persistence, isolation, and stopped restore passed") {
            throw "M2 integration smoke failed"
          }
          if (Test-Path (Join-Path $fixture ".strukt")) {
            throw "M2 smoke created workspace metadata"
          }
      - name: Smoke persistent local sessions
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 3
        run: |
          fixture="$(mktemp -d)"
          cargo run -p strukt-app -- --session-smoke "$fixture" |
            tee session-smoke.log
          grep -Fx \
            "strukt M3 session smoke: hierarchy, isolation, detach, reattach, history, termination, and stopped restore passed" \
            session-smoke.log
          test ! -e "$fixture/.strukt"
      - name: Smoke persistent local sessions
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ("strukt-session-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          $output = & cargo run -p strukt-app -- --session-smoke $fixture 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) {
            throw "persistent session smoke exited with code $LASTEXITCODE"
          }
          $marker = "strukt M3 session smoke: hierarchy, isolation, detach, reattach, history, termination, and stopped restore passed"
          if (($output -join [Environment]::NewLine) -notmatch [regex]::Escape($marker)) {
            throw "persistent session smoke marker missing"
          }
          if (Test-Path (Join-Path $fixture ".strukt")) {
            throw "persistent session smoke created workspace metadata"
          }
      - name: Smoke SSH remote workspace
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 3
        run: |
          fixture="$(mktemp -d)"
          cargo run -p strukt-app -- --remote-smoke "$fixture" |
            tee remote-smoke.log
          grep -Fx \
            "strukt M4 remote smoke: ssh, fallback, files, edit, search, git, task, language, disconnect, and reconnect passed" \
            remote-smoke.log
          test ! -e "$fixture/.strukt"
      - name: Smoke SSH remote workspace
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ("strukt-remote-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          $output = & cargo run -p strukt-app -- --remote-smoke $fixture 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) {
            throw "SSH remote workspace smoke exited with code $LASTEXITCODE"
          }
          $marker = "strukt M4 remote smoke: ssh, fallback, files, edit, search, git, task, language, disconnect, and reconnect passed"
          if (($output -join [Environment]::NewLine) -notmatch [regex]::Escape($marker)) {
            throw "SSH remote workspace smoke marker missing"
          }
          if (Test-Path (Join-Path $fixture ".strukt")) {
            throw "SSH remote smoke created workspace metadata"
          }
      - name: Validate disposable real OpenSSH host
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          remote_root="$fixture/workspace"
          mkdir -p "$remote_root" "$HOME/.ssh"
          printf 'strukt real ssh\n' > "$remote_root/README.md"

          ssh-keygen -q -t ed25519 -N '' -f "$fixture/host_key"
          ssh-keygen -q -t ed25519 -N '' -f "$fixture/client_key"
          cp "$fixture/client_key.pub" "$fixture/authorized_keys"

          helper="$fixture/run-helper"
          printf '#!/usr/bin/env bash\nexec "%s/target/debug/strukt-remote" --stdio\n' \
            "$GITHUB_WORKSPACE" > "$helper"
          chmod 700 "$helper"

          port=49222
          user="$(id -un)"
          config="$fixture/sshd_config"
          printf '%s\n' \
            "Port $port" \
            'ListenAddress 127.0.0.1' \
            "HostKey $fixture/host_key" \
            "PidFile $fixture/sshd.pid" \
            "AuthorizedKeysFile $fixture/authorized_keys" \
            'PasswordAuthentication no' \
            'KbdInteractiveAuthentication no' \
            'PubkeyAuthentication yes' \
            'PermitRootLogin no' \
            'UsePAM no' \
            'StrictModes no' \
            "AllowUsers $user" \
            "ForceCommand $helper" \
            > "$config"

          sudo mkdir -p /run/sshd
          /usr/sbin/sshd -t -f "$config"
          /usr/sbin/sshd -D -e -f "$config" 2> "$fixture/sshd.log" &
          sshd_pid=$!
          trap 'kill "$sshd_pid" 2>/dev/null || true' EXIT

          for _ in {1..20}; do
            if ssh-keyscan -T 1 -p "$port" 127.0.0.1 \
                > "$fixture/known_hosts" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          test -s "$fixture/known_hosts" || {
            cat "$fixture/sshd.log"
            exit 1
          }

          ssh_config="$HOME/.ssh/config"
          printf '%s\n' \
            'Host strukt-ci-real' \
            '  HostName 127.0.0.1' \
            "  Port $port" \
            "  User $user" \
            "  IdentityFile $fixture/client_key" \
            '  IdentitiesOnly yes' \
            "  UserKnownHostsFile $fixture/known_hosts" \
            '  StrictHostKeyChecking yes' \
            '  BatchMode yes' \
            > "$ssh_config"
          chmod 600 "$ssh_config" "$fixture/client_key" "$fixture/authorized_keys"

          STRUKT_REAL_SSH_EXECUTABLE=/usr/bin/ssh \
          STRUKT_REAL_SSH_ALIAS=strukt-ci-real \
          STRUKT_REAL_SSH_ROOT="$remote_root" \
            cargo test -p strukt-remote --test native_ssh \
              disposable_real_openssh_runs_the_helper_protocol \
              -- --ignored --exact
      - name: Smoke launch native Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $output = & cargo run -p strukt-app -- --smoke-test 2>&1
          $output | Write-Output

          if ($LASTEXITCODE -ne 0) {
            throw "strukt smoke test exited with code $LASTEXITCODE"
          }

          if (($output -join "`n") -notmatch "strukt smoke test: native event loop started") {
            throw "strukt smoke test did not emit its success marker"
          }
